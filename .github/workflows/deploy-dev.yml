# This workflow deploys the master brance to the dev site

name: dev-deployment

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'master'
      py_branch:
        description: 'openreview-py branch to deploy'
        required: false
        default: 'master'
  # Triggers the workflow on push events but only for the master branch
  push:
    branches: [ master ]
jobs:
  deploy:
    # Allow the job to fetch a GitHub ID token
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Run deploy script
        run: |
          gcloud config set compute/zone us-central1-b
          gcloud compute ssh --tunnel-through-iap openreview@openreview-matcher-dev --command '/bin/matcher_build_dev.sh -b ${{ inputs.branch || 'master' }} -p ${{ inputs.py_branch || 'master' }}' --quiet
