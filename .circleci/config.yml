# OpenReview Matcher CircleCI 2.0 configuration file 28
version: 2.1

parameters:
  openreview-api-v1-branch:
    type: string
    default: "master"
  openreview-api-v2-branch:
    type: string
    default: "main"

jobs:
  install-package:
    parameters:
      python-version:
        type: string
    docker:
      - image: cimg/python:<<parameters.python-version>>
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: |
            pip install -e .
      - run:
          name: Verify Installation
          command: python -c "import matcher, matcher.service.server"
  build:
    # Runs on a VM rather than the Docker executor: MongoDB 8 refuses to start on
    # Linux kernel >= 6.19 (SERVER-121912), which CircleCI's shared Docker hosts now
    # run, and Ubuntu 22.04's kernel is older. Same setup as openreview-py.
    machine:
      image: ubuntu-2204:current
    resource_class: large
    parallelism: 10
    working_directory: ~/
    steps:
      - checkout:
          path: ~/openreview-matcher-repo
      # Versions match what openreview-api is tested with. --network host gives the
      # same localhost networking the Docker executor's service containers had.
      - run:
          name: Start service containers
          command: |
            docker run -d --name redis --network host redis:7.4.11 redis-server --protected-mode no
            docker run -d --name mongo --network host mongo:8.0 --replSet rs0
            docker run -d --name elasticsearch --network host \
              -e discovery.type=single-node \
              -e xpack.security.enabled=false \
              -e "ES_JAVA_OPTS=-Xms512m -Xmx512m" \
              elasticsearch:7.17.28
      - run:
          name: Initialize MongoDB replica set
          command: |
            for i in $(seq 1 30); do
              if docker exec mongo mongosh --quiet --eval 'db.adminCommand("ping").ok' >/dev/null 2>&1; then
                docker exec mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
                exit 0
              fi
              echo "waiting for mongod... ($i)"
              sleep 2
            done
            echo "ERROR: mongod did not become ready after 60s" >&2
            docker logs mongo 2>&1 | tail -50
            exit 1
      - run:
          name: Wait for Elasticsearch
          command: |
            for i in $(seq 1 30); do
              if curl -sf http://localhost:9200/_cluster/health >/dev/null; then
                echo "elasticsearch is up"
                exit 0
              fi
              echo "waiting for elasticsearch... ($i)"
              sleep 2
            done
            echo "ERROR: elasticsearch did not become ready after 60s" >&2
            docker logs elasticsearch 2>&1 | tail -50
            exit 1
      # The machine image puts an nvm-managed Node first on PATH, which would shadow
      # a system-wide install, so select the version through nvm.
      - run:
          name: Install Node.js 24
          command: |
            nvm install 24
            nvm alias default 24
      - run:
          name: Check Node.js version
          command: |
            node --version
            npm --version
            node --version | grep -q '^v24\.'
      - run:
          # Matches the Python of the prod conda env (openreview-310) on instance-matching-server.
          name: Select Python 3.10
          command: |
            PY_VERSION=$(pyenv versions --bare | grep -E '^3\.10\.[0-9]+$' | sort -V | tail -1 || true)
            if [ -z "$PY_VERSION" ]; then
              PY_VERSION=$(pyenv install --list | tr -d ' ' | grep -E '^3\.10\.[0-9]+$' | sort -V | tail -1)
              pyenv install -s "$PY_VERSION"
            fi
            pyenv global "$PY_VERSION"
            python --version
      - run:
          name: Generate GitHub App token
          command: |
            pip install PyJWT==2.15.1 cryptography==50.0.2 --quiet

            cat > /tmp/get_token.py \<< 'PYEOF'
            import jwt, time, json, os, urllib.request

            private_key = os.environ["GITHUB_APP_PRIVATE_KEY"]
            app_id = os.environ["GITHUB_APP_ID"]
            install_id = os.environ["GITHUB_APP_INSTALLATION_ID"]
            now = int(time.time())

            app_jwt = jwt.encode(
                {"iat": now - 60, "exp": now + (9 * 60), "iss": app_id},
                private_key,
                algorithm="RS256"
            )

            req = urllib.request.Request(
                f"https://api.github.com/app/installations/{install_id}/access_tokens",
                method="POST",
                headers={
                    "Authorization": f"Bearer {app_jwt}",
                    "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28"
                }
            )
            with urllib.request.urlopen(req) as resp:
                print(json.load(resp)["token"])
            PYEOF

            TOKEN=$(python3 /tmp/get_token.py)

            echo "export GITHUB_TOKEN=$TOKEN" >> $BASH_ENV
      - run:
          name: Clone OpenReview API V1 branch << pipeline.parameters.openreview-api-v1-branch >>
          command: |
            git clone https://x-access-token:$GITHUB_TOKEN@github.com/openreview/openreview-api-v1.git ~/openreview
            cd ~/openreview && git checkout << pipeline.parameters.openreview-api-v1-branch >>
      - run:
          name: Clone OpenReview API V2 branch << pipeline.parameters.openreview-api-v2-branch >>
          command: |
            git clone https://x-access-token:$GITHUB_TOKEN@github.com/openreview/openreview-api.git ~/openreview-v2
            cd ~/openreview-v2 && git checkout << pipeline.parameters.openreview-api-v2-branch >>
      - run:
          name: Clone openreview-py
          command: |
            git clone https://github.com/openreview/openreview-py.git ~/openreview-py
      - run:
          name: Create API directories
          command: |
            mkdir -p ~/openreview/logs
            mkdir -p ~/openreview/files/attachments
            mkdir -p ~/openreview/files/pdfs
            mkdir -p ~/openreview/files/temp
            mkdir -p ~/openreview-v2/logs
            mkdir -p ~/openreview-v2/files/attachments
            mkdir -p ~/openreview-v2/files/pdfs
            mkdir -p ~/openreview-v2/files/temp
      - run:
          name: Setup Python virtual environment
          command: |
            python -m venv matcher
      - run:
          name: Install dependencies
          command: |
            source matcher/bin/activate
            cd ~/openreview-matcher-repo
            pip install -e .
      - run:
          name: Install openreview-py
          command: |
            source matcher/bin/activate
            cd ~/openreview-matcher-repo
            pip install -e ~/openreview-py
      # cleanStart opens the port before it finishes creating the setup invitations and
      # only then prints "Setup Complete!", so the port alone does not mean ready.
      - run:
          name: Start API V1
          command: |
            source matcher/bin/activate
            cd ~/openreview
            npm run cleanStart 2>&1 | tee ~/openreview/logs/api-v1-cleanStart.log
          background: true
      - run:
          name: Wait for API V1 setup
          command: |
            source ~/openreview-matcher-repo/.circleci/ci-utils.sh
            wait_for_line "Setup Complete!" ~/openreview/logs/api-v1-cleanStart.log 600
      - run:
          name: Start API V2
          command: |
            source matcher/bin/activate
            cd ~/openreview-v2
            npm run cleanStart 2>&1 | tee ~/openreview-v2/logs/api-v2-cleanStart.log
          background: true
      - run:
          name: Wait for API V2 setup
          command: |
            source ~/openreview-matcher-repo/.circleci/ci-utils.sh
            wait_for_line "Setup Complete!" ~/openreview-v2/logs/api-v2-cleanStart.log 600
      - run:
          name: Run tests
          command: |
            source matcher/bin/activate
            cd ~/openreview-matcher-repo
            mkdir -p reports/pytest
            TEST_FILES=$(circleci tests glob "tests/test_*.py")
            echo "$TEST_FILES" | circleci tests run --command="xargs pytest --durations=0 -o junit_family=legacy --junitxml=reports/pytest/pytest-report.xml" --verbose --split-by=timings
      - store_test_results:
          path: reports
      - store_artifacts:
          path: reports

workflows:
  version: 2
  build:
    jobs:
      - install-package:
          matrix:
            parameters:
              python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      - build:
          requires:
            - install-package
