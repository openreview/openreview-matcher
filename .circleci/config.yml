# OpenReview Matcher CircleCI 2.0 configuration file 28
version: 2.1

parameters:
  openreview-api-v1-branch:
    type: string
    default: "master"
  openreview-api-v2-branch:
    type: string
    default: "main"

jobs:
  install-package:
    parameters:
      python-version:
        type: string
    docker:
      - image: cimg/python:<<parameters.python-version>>
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: |
            pip install -e .
      - run:
          name: Verify Installation
          command: python -c "import matcher, matcher.service.server"
  build:
    # The resource_class feature allows configuring CPU and RAM resources for each job. Different resource classes are available for different executors. https://circleci.com/docs/2.0/configuration-reference/#resourceclass
    resource_class: large
    parallelism: 10
    working_directory: ~/
    docker:
      # Matches the Python of the prod conda env (openreview-310) on instance-matching-server.
      - image: cimg/python:3.10-node
      - image: cimg/redis:6.2.6
      - image: mongo:6.0
        command: [ --replSet, rs0 ]
      - image: docker.elastic.co/elasticsearch/elasticsearch:7.7.0
        environment:
          xpack.security.enabled: false
          transport.host: localhost
    steps:
      - checkout:
          path: ~/openreview-matcher-repo
      - run:
          name: Initialize replica set
          command: |
            # Source the utility functions  
            source ~/openreview-matcher-repo/.circleci/ci-utils.sh

            retry sudo apt-get install gnupg curl
            curl -fsSL https://pgp.mongodb.com/server-6.0.asc | sudo gpg -o /usr/share/keyrings/mongodb-server-6.0.gpg --dearmor
            echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-6.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/6.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-6.0.list
            retry sudo apt-get update
            retry sudo apt-get upgrade -y
            retry sudo apt-get install -y mongodb-org=6.0.7
            mongosh mongodb://localhost:27017 --eval "rs.initiate()"
      - run:
          name: Generate GitHub App token
          command: |
            pip install PyJWT==2.15.1 cryptography==50.0.2 --quiet

            cat > /tmp/get_token.py \<< 'PYEOF'
            import jwt, time, json, os, urllib.request

            private_key = os.environ["GITHUB_APP_PRIVATE_KEY"]
            app_id = os.environ["GITHUB_APP_ID"]
            install_id = os.environ["GITHUB_APP_INSTALLATION_ID"]
            now = int(time.time())

            app_jwt = jwt.encode(
                {"iat": now - 60, "exp": now + (9 * 60), "iss": app_id},
                private_key,
                algorithm="RS256"
            )

            req = urllib.request.Request(
                f"https://api.github.com/app/installations/{install_id}/access_tokens",
                method="POST",
                headers={
                    "Authorization": f"Bearer {app_jwt}",
                    "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28"
                }
            )
            with urllib.request.urlopen(req) as resp:
                print(json.load(resp)["token"])
            PYEOF

            TOKEN=$(python3 /tmp/get_token.py)

            echo "export GITHUB_TOKEN=$TOKEN" >> $BASH_ENV
      - run:
          name: Clone OpenReview API V1 branch << pipeline.parameters.openreview-api-v1-branch >>
          command: |
            git clone https://x-access-token:$GITHUB_TOKEN@github.com/openreview/openreview-api-v1.git ~/openreview
            cd ~/openreview && git checkout << pipeline.parameters.openreview-api-v1-branch >>
      - run:
          name: Clone OpenReview API V2 branch << pipeline.parameters.openreview-api-v2-branch >>
          command: |
            git clone https://x-access-token:$GITHUB_TOKEN@github.com/openreview/openreview-api.git ~/openreview-v2
            cd ~/openreview-v2 && git checkout << pipeline.parameters.openreview-api-v2-branch >>
      - run:
          name: Clone openreview-py
          command: |
            git clone https://github.com/openreview/openreview-py.git ~/openreview-py
      - run:
          name: Create API directories
          command: |
            mkdir -p ~/openreview/logs
            mkdir -p ~/openreview/files/attachments
            mkdir -p ~/openreview/files/pdfs
            mkdir -p ~/openreview/files/temp
            mkdir -p ~/openreview-v2/logs
            mkdir -p ~/openreview-v2/files/attachments
            mkdir -p ~/openreview-v2/files/pdfs
            mkdir -p ~/openreview-v2/files/temp
      - run:
          name: Setup Python virtual environment
          command: |
            python -m venv matcher
      - run:
          name: Install dependencies
          command: |
            source matcher/bin/activate
            cd ~/openreview-matcher-repo
            pip install -e .
      - run:
          name: Install openreview-py
          command: |
            source matcher/bin/activate
            cd ~/openreview-matcher-repo
            pip install -e ~/openreview-py
      # cleanStart opens the port before it finishes creating the setup invitations and
      # only then prints "Setup Complete!", so the port alone does not mean ready.
      - run:
          name: Start API V1
          command: |
            source matcher/bin/activate
            cd ~/openreview
            npm run cleanStart 2>&1 | tee ~/openreview/logs/api-v1-cleanStart.log
          background: true
      - run:
          name: Wait for API V1 setup
          command: |
            source ~/openreview-matcher-repo/.circleci/ci-utils.sh
            wait_for_line "Setup Complete!" ~/openreview/logs/api-v1-cleanStart.log 600
      - run:
          name: Start API V2
          command: |
            source matcher/bin/activate
            cd ~/openreview-v2
            npm run cleanStart 2>&1 | tee ~/openreview-v2/logs/api-v2-cleanStart.log
          background: true
      - run:
          name: Wait for API V2 setup
          command: |
            source ~/openreview-matcher-repo/.circleci/ci-utils.sh
            wait_for_line "Setup Complete!" ~/openreview-v2/logs/api-v2-cleanStart.log 600
      - run:
          name: Run tests
          command: |
            source matcher/bin/activate
            cd ~/openreview-matcher-repo
            mkdir -p reports/pytest
            TEST_FILES=$(circleci tests glob "tests/test_*.py")
            echo "$TEST_FILES" | circleci tests run --command="xargs pytest --durations=0 -o junit_family=legacy --junitxml=reports/pytest/pytest-report.xml" --verbose --split-by=timings
      - store_test_results:
          path: reports
      - store_artifacts:
          path: reports

workflows:
  version: 2
  build:
    jobs:
      - install-package:
          matrix:
            parameters:
              python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      - build:
          requires:
            - install-package
